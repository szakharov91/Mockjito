name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore Mockjito.sln
      - run: dotnet build Mockjito.sln -c Release --no-restore
      - run: dotnet test Mockjito.sln -c Release --no-build --logger "trx;LogFileName=test_results.trx"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/test_results.trx"

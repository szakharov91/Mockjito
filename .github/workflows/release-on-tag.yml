name: Release On Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Mockjito.sln

      - name: Build
        run: dotnet build Mockjito.sln -c Release --no-restore

      - name: Publish single-file executable
        run: dotnet publish Mockjito.ConsoleApp/Mockjito.ConsoleApp.csproj -c Release -o publish --no-build

      - name: Upload executable to release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/mockjito.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
